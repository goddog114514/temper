[workspace]
resolver = "2"
members = ["crates/temper-core", "crates/temper-server"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
