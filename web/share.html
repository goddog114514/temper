<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分享的进行 — 调律 TEMPER</title>
<meta name="description" content="一条保存下来的和弦进行。可以直接试听，也可以带回调律工坊继续改。">
<meta name="theme-color" content="#F3F0E7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317150F'/%3E%3Cpath d='M11 8v9a5 5 0 0 0 10 0V8' fill='none' stroke='%23F3F0E7' stroke-width='2'/%3E%3Cpath d='M16 22v3' stroke='%23F3F0E7' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<a class="skip" href="#main">跳到正文</a>

<header class="top">
  <div class="wrap top__in">
    <a class="brand" href="/" aria-label="调律 TEMPER 首页">
      <svg viewBox="0 0 22 22" aria-hidden="true"><path d="M6.2 2.6v7.2a4.8 4.8 0 0 0 9.6 0V2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M11 14.6V19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="11" cy="20" r="1.1" fill="currentColor"/></svg>
      <span>调律</span><small>TEMPER</small>
    </a>
    <nav aria-label="主导航">
      <a href="/">手册</a>
      <a href="/studio">工坊</a>
      <a href="/practice">练习</a>
      <a href="/profile">档案</a>
    </nav>
    <div class="top__meta"><span class="dot" data-health data-state="loading"></span><span data-device>—</span></div>
  </div>
</header>

<main id="main" class="page">
  <div class="wrap">
    <div class="pagehead">
      <div>
        <div class="eyebrow"><span>Shared progression</span><span class="rule"></span><span id="shareCode">—</span></div>
        <h1 id="shareTitle">一条进行。</h1>
      </div>
      <p id="shareMeta">正在读取…</p>
    </div>

    <section class="panel" id="sharePanel" hidden aria-labelledby="prog-h">
      <div class="panel__head">
        <h2 id="prog-h">和弦进行</h2>
        <span class="kicker" id="shareTempo">—</span>
      </div>
      <div class="stage" id="shareSlots" style="padding:14px;min-height:110px"></div>
      <div class="tablewrap" style="margin-top:16px">
        <table>
          <thead><tr><th>小节</th><th>级数</th><th>和弦</th><th>音</th></tr></thead>
          <tbody id="shareTable"></tbody>
        </table>
      </div>
      <div class="row" style="margin-top:18px">
        <button class="btn" type="button" id="sharePlay">播放</button>
        <button class="btn btn--ghost" type="button" id="shareStop" disabled>停止</button>
        <span class="spacer"></span>
        <a class="btn btn--ghost" id="shareImport" href="/studio">在工坊中继续</a>
      </div>
    </section>

    <section class="panel" id="shareError" hidden style="margin-top:var(--gap)">
      <h2 style="font-family:var(--f-display);font-size:30px;font-weight:400">这条链接不在了</h2>
      <p class="small muted" style="margin-top:8px;line-height:1.7">分享码可能过期或输入有误。回到工坊重新生成一条，或者先听一段手册里的例子。</p>
      <div class="row" style="margin-top:16px">
        <a class="btn" href="/studio">打开工坊</a>
        <a class="btn btn--ghost" href="/">回到手册</a>
      </div>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <span>TEMPER · 调律 — 分享</span>
    <span id="shareFoot">分享只包含调、速度与级数</span>
    <a href="/" class="linkish">回到手册</a>
  </div>
</footer>

<script type="module" src="/js/share.js"></script>
</body>
</html>
